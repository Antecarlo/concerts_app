name: Tests

"on":
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database tests
        run: |
          python -m pytest tests/test_database.py -v --tb=short

      - name: Run PDF parser unit tests (skip real PDF integration)
        run: |
          python -m pytest tests/test_pdf_parser.py -v --tb=short -k "not real_pdf"

      - name: Run all unit tests (except real PDF)
        if: ${{ always() }}
        run: |
          python -m pytest tests/ -v --tb=short -k "not real_pdf"